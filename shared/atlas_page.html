<title>Context Store</title>
<style>
:root{
  --void:#070b12; --void-2:#0d1420; --haze:#16202f;
  --card:#f2f0ea; --card-2:#e7e3d9; --rule:#c9c4b8; --ink:#14181f;
  --dim:#63718a; --star:#dce7f5; --patina:#5fae99; --brass:#c9a24d;
  --tech_stack:#5fd3b8; --architecture:#7fb4e0; --config:#b3cc6a;
  --decisions:#e0b45a; --tasks:#c79ae0; --fact:#e89f7c; --preference:#9fb0ec;
  --note:#d8bc9a;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --serif:ui-serif,Charter,"Bitstream Charter",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--void);color:var(--star);font-family:var(--mono);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}

.mast{position:fixed;top:0;left:0;right:0;z-index:7;display:flex;justify-content:space-between;
  align-items:flex-start;gap:20px;padding:20px 26px;pointer-events:none}
.mast>*{pointer-events:auto}
.mast h1{font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:0}
.mast h1 em{font-style:normal;color:var(--patina)}
.tally{display:flex;gap:0 16px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin-top:5px}
.tally b{color:var(--star);font-weight:700}
.views{display:flex;border:1px solid var(--haze);background:rgba(7,11,18,.8)}
.views button{background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:10px;
  letter-spacing:.17em;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--patina);color:var(--void);font-weight:700}
.views button:focus-visible{outline:2px solid var(--patina);outline-offset:2px}

/* ── the sky ─────────────────────────────────────────────── */
#sky{position:fixed;inset:0;display:block}
#sky.grab{cursor:grab}
#sky.grabbing{cursor:grabbing}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;align-items:center;
  gap:14px;padding:14px 26px 18px;background:linear-gradient(transparent,rgba(7,11,18,.94) 42%)}
body.reading .nav{background:var(--void-2);border-top:1px solid var(--haze)}
.arrow{background:none;border:1px solid var(--haze);color:var(--dim);font-family:var(--mono);
  font-size:15px;line-height:1;padding:7px 11px;cursor:pointer;flex:none}
.arrow:hover:not(:disabled){color:var(--star);border-color:var(--dim)}
.arrow:disabled{opacity:.25;cursor:default}
.arrow:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
.ticks{flex:1;display:flex;gap:0;overflow:hidden}
.tick{flex:1;background:none;border:0;padding:9px 4px 7px;cursor:pointer;text-align:center;
  font-family:var(--mono);color:var(--dim);border-top:2px solid var(--haze);min-width:0}
.tick:hover{color:var(--star);border-top-color:var(--dim)}
.tick[aria-selected="true"]{color:var(--star);border-top-color:var(--patina)}
.tick:focus-visible{outline:2px solid var(--patina);outline-offset:-2px}
.tick-n{display:block;font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.tick-c{display:block;font-size:9px;letter-spacing:.09em;font-variant-numeric:tabular-nums}
.hint{position:fixed;right:26px;bottom:74px;z-index:3;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim)}

/* ── catalogue overlay ───────────────────────────────────── */
#cat{position:fixed;inset:0;z-index:4;background:var(--void-2);overflow-y:auto;display:none}
.backbtn{background:none;border:1px solid var(--haze);color:var(--dim);font-family:var(--mono);
  font-size:10px;letter-spacing:.17em;text-transform:uppercase;padding:7px 13px;cursor:pointer;
  margin-bottom:20px}
.backbtn:hover{color:var(--star);border-color:var(--dim)}
.backbtn:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
.zoom{display:flex;gap:0;flex:none}
.zoom button{background:none;border:1px solid var(--haze);border-left:0;color:var(--dim);
  font-family:var(--mono);font-size:13px;line-height:1;padding:7px 10px;cursor:pointer}
.zoom button:first-child{border-left:1px solid var(--haze)}
.zoom button:hover{color:var(--star);border-color:var(--dim)}
.zoom button:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
#cat.on{display:block}
.cwrap{max-width:1180px;margin:0 auto;padding:88px 26px 116px}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:20px;
  flex-wrap:wrap;margin-bottom:26px}
.chead h2{font-size:clamp(22px,3.6vw,34px);font-weight:700;letter-spacing:-.035em;
  text-transform:uppercase;margin:0}
.group{margin:0 0 26px}
.group-hd{display:flex;align-items:center;gap:11px;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);margin:0 0 11px}
.group-hd .sw{width:8px;height:8px;flex:none}
.group-hd .ln{flex:1;height:1px;background:var(--haze)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:12px}
.slot{position:relative;cursor:pointer;border:0;padding:0;background:none;text-align:left;
  font-family:inherit}
.slot .stack{position:absolute;inset:0;pointer-events:none}
.slot .stack i{position:absolute;inset:0;background:var(--card-2);border:1px solid var(--rule);
  transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.face{position:relative;background:var(--card);border:1px solid var(--rule);border-top-width:3px;
  padding:12px 13px 11px;color:var(--ink);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.slot:hover .face,.slot:focus-visible .face{transform:translate(-3px,-3px)}
.slot:focus-visible{outline:2px solid var(--patina);outline-offset:4px}
.slot:hover .stack i:nth-child(1),.slot:focus-visible .stack i:nth-child(1){transform:translate(4px,4px)}
.slot:hover .stack i:nth-child(2),.slot:focus-visible .stack i:nth-child(2){transform:translate(8px,8px)}
.slot:hover .stack i:nth-child(3),.slot:focus-visible .stack i:nth-child(3){transform:translate(12px,12px)}
.slot-k{font-size:13.5px;font-weight:700;margin:0 0 6px;word-break:break-word}
.slot-c{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6f6a5f}
.slot-m{display:flex;justify-content:space-between;gap:8px;margin-top:9px;padding-top:7px;
  border-top:1px solid var(--rule);font-size:10.5px;color:#6f6a5f;font-variant-numeric:tabular-nums}
.vcount{color:#2c7a66;font-weight:700}
/* History sits under the cards of its category: subordinate to current state,
   but in the same place you would look for it. */
.hist{margin-top:11px;border-top:1px solid var(--haze)}
.hist summary{list-style:none;cursor:pointer;padding:9px 2px 0;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hist summary::-webkit-details-marker{display:none}
.hist summary:hover{color:var(--star)}
.hist summary:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
.hist summary .caret{display:inline-block;width:11px;color:var(--patina)}
.hist[open] summary .caret{transform:rotate(90deg)}
.hrow{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:baseline;
  width:100%;background:none;border:0;border-bottom:1px solid var(--haze);
  padding:9px 2px;cursor:pointer;text-align:left;font-family:var(--mono);color:var(--dim)}
.hrow:hover{color:var(--star);background:rgba(255,255,255,.02)}
.hrow:focus-visible{outline:2px solid var(--patina);outline-offset:-2px}
.hdate{font-size:10.5px;font-variant-numeric:tabular-nums}
.hexc{font-family:var(--serif);font-size:13.5px;line-height:1.45;color:#9fb2cd;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical}
.hrow:hover .hexc{color:var(--card)}
.hchars{font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── reading drawer ──────────────────────────────────────── */
#card{position:fixed;z-index:6;width:min(380px,88vw);max-height:56vh;overflow-y:auto;
  background:var(--card);color:var(--ink);border:1px solid var(--rule);border-top-width:3px;
  padding:14px 16px 15px;display:none;box-shadow:0 12px 34px rgba(0,0,0,.5)}
#card.on{display:block}
#card .ck{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:#6f6a5f;margin:0 0 3px}
#card .cn{font-size:19px;font-weight:700;letter-spacing:-.03em;margin:0 0 3px;word-break:break-word}
#card .cm{font-size:10.5px;color:#6f6a5f;margin:0 0 11px;font-variant-numeric:tabular-nums}
#card .ct{font-family:var(--serif);font-size:14.5px;line-height:1.55;white-space:pre-wrap;margin:0}
#card .cd{font-size:11px;color:#6f6a5f;font-style:italic;margin:0 0 10px}
#card .cl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12px;margin:0}
#card .cl span:nth-child(even){color:#6f6a5f;font-variant-numeric:tabular-nums;text-align:right}
#card .cgo{margin-top:12px;background:none;border:1px solid var(--rule);color:var(--ink);
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  padding:6px 10px;cursor:pointer;width:100%}
#card .cgo:hover{background:var(--card-2)}
.scrim{position:fixed;inset:0;background:rgba(4,7,12,.7);opacity:0;pointer-events:none;
  transition:opacity .24s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(650px,94vw);background:var(--card);
  color:var(--ink);overflow-y:auto;z-index:6;transform:translateX(101%);
  transition:transform .3s cubic-bezier(.2,.7,.3,1);border-left:1px solid var(--rule)}
.drawer.on{transform:none}
.dpad{padding:24px 28px 56px}
.dclose{position:sticky;top:0;float:right;background:var(--card);border:1px solid var(--rule);
  color:var(--ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:5px 10px;cursor:pointer}
.dcat{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:#6f6a5f;margin:0 0 4px}
.dkey{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:0 0 3px;word-break:break-word}
.dmeta{font-size:11px;color:#6f6a5f;margin:0 0 18px;font-variant-numeric:tabular-nums}
.dtext{font-family:var(--serif);font-size:16px;line-height:1.62;white-space:pre-wrap;margin:0;
  color:#22262c}
.vhead{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#6f6a5f;margin:30px 0 0;
  padding-top:16px;border-top:2px solid var(--ink)}
.ver{border-left:2px solid var(--rule);padding:12px 0 12px 15px;margin-top:14px}
.ver-m{font-size:10.5px;color:#6f6a5f;font-variant-numeric:tabular-nums;margin-bottom:6px}
.ver-w{font-size:12px;color:#2c7a66;margin-bottom:7px}
.ver-t{font-family:var(--serif);font-size:14px;line-height:1.55;white-space:pre-wrap;color:#4a4f56;margin:0}

@media (max-width:640px){.cwrap{padding:78px 15px 80px}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="sky" class="grab"></canvas>

<header class="mast">
  <div>
    <h1>Context <em>Store</em></h1>
    <div class="tally" id="tally"></div>
  </div>
  <div class="views" role="group" aria-label="View">
    <button id="v-sky" aria-pressed="true">Constellations</button>
    <button id="v-cat" aria-pressed="false">Catalogue</button>
  </div>
</header>

<div class="hint" id="hint">← → travel · drag to pan · scroll to zoom · click a category to name its slots · faint motes are history</div>

<nav class="nav">
  <button class="arrow" id="prev" aria-label="Previous project">&#8592;</button>
  <div class="ticks" id="ticks" role="tablist"></div>
  <button class="arrow" id="next" aria-label="Next project">&#8594;</button>
  <div class="zoom" role="group" aria-label="Zoom">
    <button id="zout" aria-label="Zoom out">&#8722;</button>
    <button id="zfit" aria-label="Fit constellation">&#9633;</button>
    <button id="zin" aria-label="Zoom in">&#43;</button>
  </div>
</nav>

<section id="cat"><div class="cwrap">
  <button class="backbtn" id="backbtn">&larr; Constellations</button>
  <div class="chead"><h2 id="cname"></h2>
  <div class="tally" id="cmeta"></div></div><div id="groups"></div></div></section>

<div id="card"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="dpad" id="dpad"></div></aside>

<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;
  if(x!==undefined)n.textContent=x;return n;};
const nf = v => v.toLocaleString();
const css = k => getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim();
const P = D.projects;
const HINT = "← → travel · drag to pan · scroll to zoom · click a category to name its slots";

$("#tally").innerHTML = `<span><b>${D.totals.projects}</b> constellations</span>` +
  `<span><b>${D.totals.slots}</b> stars</span><span><b>${D.totals.chunks}</b> history</span>`;

/* Deterministic jitter: a constellation must look the same every visit.
   Position is how you remember where something was. */
function rng(seed){ let h=1779033703^seed.length;
  for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);
    return ((h^=h>>>16)>>>0)/4294967296;};
}

const CELL = 1360;           // horizontal spacing between constellations
const BRANCH_SPREAD = 2.7;   // radians the category branches fan across
/* Three tiers, because that is what the data is:
     project anchor  ->  category anchor  ->  slots
   Slots fan in PARALLEL off their category, not chained. They are siblings;
   a chain would assert an order between them that does not exist. Where a
   category has an unkeyed main slot, that slot IS the category anchor rather
   than a duplicate node sitting next to it. */
const sky = P.map((p, pi) => {
  const r = rng(p.name);
  const cats = [...new Set(p.slots.map(s => s.cat))];
  const anchor = {x: pi*CELL, y: 120, kind:"anchor", proj:p, label:p.name};
  const stars = [anchor], lines = [];
  cats.forEach((cat, ci) => {
    const t = cats.length === 1 ? .5 : ci/(cats.length-1);
    const ang = -Math.PI/2 - BRANCH_SPREAD/2 + t*BRANCH_SPREAD + (r()-.5)*.10;
    const inCat = p.slots.filter(s => s.cat === cat);
    const main  = inCat.find(s => !s.key) || null;
    const kids  = inCat.filter(s => s.key);
    const cd = 236 + r()*26;
    const cnode = {
      x: anchor.x + Math.cos(ang)*cd,
      y: anchor.y - Math.sin(ang)*cd*0.62,
      kind: main ? "catmain" : "cat",
      cat, proj:p, slot: main, label: cat, count: inCat.length,
    };
    stars.push(cnode); lines.push([anchor, cnode]);
    const m = kids.length;
    // Wider fan for a fuller category, and three radii so a crowded one
    // reads as depth rather than a smear.
    const sub = Math.min(0.95, 0.25 + m*0.07);
    kids.forEach((s, j) => {
      const off = m === 1 ? 0 : ((j-(m-1)/2)/((m-1)/2)) * (sub/2);
      const a2 = ang + off + (r()-.5)*.05;
      const d2 = 122 + (j % 3)*46 + r()*16;
      stars.push({
        x: cnode.x + Math.cos(a2)*d2,
        y: cnode.y - Math.sin(a2)*d2*0.62,
        kind:"star", slot:s, proj:p, cat, label:s.key,
      });
      lines.push([cnode, stars[stars.length-1]]);
    });
  });
  /* The live history, scattered around the category it belongs to. Not another
     tier — chunks have no place in the project/category/slot hierarchy — but the
     medium each constellation sits in. Density is honest: a project that has been
     worked on carries a thick cloud, a backfilled one sits in clear sky. */
  return {p, anchor, stars, lines};
});

const cv = $("#sky"), ctx = cv.getContext("2d");
let W=0, H=0, sel=0, hover=null, dragging=false;
/* Which category has been opened up. Slot names stay hidden until you either
   zoom past LABEL_K or click a category — 84 names on screen at once is not a
   map, it is a wall. */
let focusCat = null;      // derived from focusNode, kept for the draw loop
let focusNode = null;     // the anchor being cycled
let phase = 0;            // 0 none · 1 highlight · 2 highlight + summary
const LABEL_K = 2.0;   // above every auto-fit level, so arriving is always quiet
/* Camera in world space: x/y is what sits at screen centre, k is scale.
   Targets are eased toward, so travel and zoom both feel like one motion. */
const cam = {x:0, y:0, k:1}, tgt = {x:0, y:0, k:1};
const TOP_PAD = 96, BOT_PAD = 118;   // masthead and nav own these bands

function resize(){ const d=window.devicePixelRatio||1;
  W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d;
  cv.style.width=W+"px"; cv.style.height=H+"px"; ctx.setTransform(d,0,0,d,0,0); }
resize(); addEventListener("resize",()=>{resize(); fit(sel);});

const sx = n => (n.x - cam.x)*cam.k + W/2;
const sy = n => (H - TOP_PAD - BOT_PAD)/2 + TOP_PAD - (n.y - cam.y)*cam.k;
const baseR = n =>
    n.kind==="anchor"  ? 10+Math.sqrt(n.proj.slots.length)*1.5 :
    n.kind==="catmain" ? 5.4+Math.sqrt(n.slot.chars)/16 :
    n.kind==="cat"     ? 4.6+Math.sqrt(n.count)*1.2 :
                         2.3+Math.sqrt(n.slot.chars)/12;
const radius = n => Math.max(1.6, baseR(n)*Math.min(cam.k,1.9));

/* Fit one constellation to the free space between masthead and nav. */
function fit(i, instant){
  const c = sky[i]; if(!c) return;
  const xs = c.stars.map(n=>n.x), ys = c.stars.map(n=>n.y);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const bw = Math.max(240, x1-x0), bh = Math.max(200, y1-y0);
  const availW = W - 150, availH = H - TOP_PAD - BOT_PAD - 90;
  tgt.k = Math.max(.22, Math.min(1.65, Math.min(availW/bw, availH/bh)));
  tgt.x = (x0+x1)/2; tgt.y = (y0+y1)/2;
  if(instant){ cam.x=tgt.x; cam.y=tgt.y; cam.k=tgt.k; }
}

function frame(){
  cam.x += (tgt.x-cam.x)*0.12; cam.y += (tgt.y-cam.y)*0.12; cam.k += (tgt.k-cam.k)*0.12;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#070b12"; ctx.fillRect(0,0,W,H);

  sky.forEach((c,i)=>{
    const ax = sx(c.anchor);
    if(ax < -CELL*cam.k || ax > W + CELL*cam.k) return;
    const on = i===sel, fade = on ? 1 : 0.16;
    ctx.lineWidth = (on ? 1.15 : .8) * Math.min(cam.k,1.5);
    c.lines.forEach(([a,b])=>{
      const g=ctx.createLinearGradient(sx(a),sy(a),sx(b),sy(b));
      const col = b.cat ? css(b.cat) : css("patina");
      const dimLine = on && focusCat && b.cat && b.cat!==focusCat;
      g.addColorStop(0,"rgba(120,140,175,"+(fade*(dimLine?.13:.34))+")");
      g.addColorStop(1,col+(on?(dimLine?"33":"88"):"22"));
      ctx.strokeStyle=g; ctx.beginPath();
      ctx.moveTo(sx(a),sy(a)); ctx.lineTo(sx(b),sy(b)); ctx.stroke();
    });
    c.stars.forEach(n=>{
      const x=sx(n), y=sy(n), r=radius(n)*(on?1:.72);
      const col = n.kind==="anchor" ? css("patina") : css(n.cat);
      const isCat = n.kind==="cat" || n.kind==="catmain";
      if(on){ const gl=ctx.createRadialGradient(x,y,0,x,y,r*4.4);
        gl.addColorStop(0,col+"55"); gl.addColorStop(1,col+"00");
        ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(x,y,r*4.4,0,7); ctx.fill(); }
      const muted = on && (
        (focusCat && n.cat && n.cat!==focusCat) ||
        (focusNode && focusNode.kind==="anchor" && n.kind==="star"));
      ctx.globalAlpha = fade * (muted ? .38 : 1);
      ctx.fillStyle = n===hover ? "#ffffff" : col;
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
      // Labels earn their place by zoom: crowding at low k helps nobody.
      const showLabel = n.kind==="anchor"
        || (on && isCat)                                  // categories, once selected
        || (on && n===hover)                              // hover always names a star
        || (on && n.kind==="star" && (cam.k>LABEL_K || n.cat===focusCat));
      if(showLabel){
        ctx.globalAlpha = on?1:.3;
        ctx.fillStyle = n.kind==="anchor" ? "#e7eefb" : isCat ? col : "#9fb2cd";
        const fs = n.kind==="anchor" ? Math.max(11,Math.min(15,14*cam.k))
                 : isCat            ? Math.max(10,Math.min(13,12*cam.k))
                                    : Math.max(9,Math.min(12,11*cam.k));
        ctx.font = (n.kind==="anchor"||isCat?"700 ":"")+fs+"px ui-monospace,Menlo,monospace";
        ctx.textAlign="center";
        ctx.fillText(n.label, x, y - r - 8);
        if(n.kind==="cat"){ ctx.globalAlpha=on?.55:.2;
          ctx.font=Math.max(9,Math.min(11,10*cam.k))+"px ui-monospace,Menlo,monospace";
          ctx.fillStyle="#8fa2bd";
          ctx.fillText(n.count+" slots", n===hover?sx(n):sx(n), sy(n)+radius(n)+14); }
        if(n.kind==="anchor"){ ctx.globalAlpha=on?.7:.25;
          ctx.font=Math.max(9,Math.min(11,10*cam.k))+"px ui-monospace,Menlo,monospace";
          ctx.fillText(n.proj.slots.length+" slots · "+nf(n.proj.chars)+" ch", x, y+r+15); }
      }
      ctx.globalAlpha=1;
    });
  });
  if(phase===2 && focusNode){
    const c=$("#card"), cw=Math.min(380,W*0.88);
    c.style.left = Math.max(12, Math.min(W-cw-12, sx(focusNode)+26))+"px";
    c.style.top  = Math.max(88, Math.min(H-190, sy(focusNode)-40))+"px";
  }
  requestAnimationFrame(frame);
}
frame();

function hit(mx,my){
  const c = sky[sel];
  for(const n of c.stars){ const dx=mx-sx(n), dy=my-sy(n);
    if(dx*dx+dy*dy < Math.pow(radius(n)+12,2)) return n; }
  return null;
}
cv.addEventListener("mousemove",e=>{
  if(dragging) return;
  hover = hit(e.clientX,e.clientY);
  cv.style.cursor = hover ? "pointer" : "grab";
});
cv.addEventListener("click",e=>{
  if(moved>6) return;                       // a drag is not a click
  const n = hit(e.clientX,e.clientY); if(!n) return;
  if(n.kind==="star"){ read(n.slot,n.proj); return; }
  // Anchors cycle: highlight what belongs to them, then show what they say,
  // then let go. Three states on one target, so nothing needs a second gesture.
  if(focusNode !== n){ focusNode = n; phase = 1; }
  else if(phase === 1){ phase = 2; }
  else { focusNode = null; phase = 0; }
  focusCat = (focusNode && focusNode.kind !== "anchor") ? focusNode.cat : null;
  if(phase === 2) showCard(focusNode); else hideCard();
});

/* Free pan in both axes. No snapping — snapping fought the drag, and the
   arrows and ticks already exist for jumping between constellations. */
let downX=0, downY=0, moved=0;
cv.addEventListener("pointerdown",e=>{
  dragging=true; moved=0; downX=e.clientX; downY=e.clientY; cv.className="grabbing";
  const mv=ev=>{
    const dx=ev.clientX-downX, dy=ev.clientY-downY;
    moved+=Math.abs(dx)+Math.abs(dy);
    tgt.x -= dx/cam.k; tgt.y += dy/cam.k;
    cam.x = tgt.x; cam.y = tgt.y;           // 1:1 with the pointer, no lag
    downX=ev.clientX; downY=ev.clientY;
  };
  const up=()=>{ dragging=false; cv.className="grab";
    removeEventListener("pointermove",mv); removeEventListener("pointerup",up);
    // Whichever anchor is nearest the centre becomes the lit one.
    let best=sel, bd=Infinity;
    sky.forEach((c,i)=>{ const d=Math.hypot(c.anchor.x-cam.x, c.anchor.y-cam.y);
      if(d<bd){bd=d; best=i;} });
    if(best!==sel){ sel=best; focusCat=null; focusNode=null; phase=0; hideCard(); marks(); }
  };
  addEventListener("pointermove",mv); addEventListener("pointerup",up);
});

function zoomAt(mx,my,factor){
  const k2 = Math.max(.18, Math.min(3.2, tgt.k*factor));
  // keep the point under the cursor fixed
  const wx = (mx - W/2)/cam.k + cam.x;
  const wy = cam.y - (my - ((H-TOP_PAD-BOT_PAD)/2 + TOP_PAD))/cam.k;
  tgt.x = wx - (mx - W/2)/k2;
  tgt.y = wy + (my - ((H-TOP_PAD-BOT_PAD)/2 + TOP_PAD))/k2;
  tgt.k = k2;
}
cv.addEventListener("wheel",e=>{ e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY<0 ? 1.13 : 0.885); }, {passive:false});
$("#zin").onclick  = ()=>zoomAt(W/2,H/2,1.25);
$("#zout").onclick = ()=>zoomAt(W/2,H/2,0.8);
$("#zfit").onclick = ()=>fit(sel);

function marks(){
  [...$("#ticks").children].forEach((t,j)=>t.setAttribute("aria-selected", j===sel));
  $("#prev").disabled = sel===0; $("#next").disabled = sel===P.length-1;
}

function goto(i){
  sel = Math.max(0, Math.min(P.length-1, i));
  focusCat = null; focusNode = null; phase = 0; hideCard();
  fit(sel);
  marks();
  // If the catalogue is open, follow the selection rather than leaving a stale
  // project on screen behind the nav that just changed.
  if($("#cat").classList.contains("on")) openCat(P[sel]);
}
$("#prev").onclick=()=>goto(sel-1);
$("#next").onclick=()=>goto(sel+1);
addEventListener("keydown",e=>{
  if($("#drawer").classList.contains("on")){ if(e.key==="Escape") shut(); return; }
  if($("#cat").classList.contains("on")){
    if(e.key==="Escape"){ closeCat(); return; }
    if(e.key==="ArrowLeft"){ goto(sel-1); return; }
    if(e.key==="ArrowRight"){ goto(sel+1); return; }
    return;
  }
  if(e.key==="ArrowLeft") goto(sel-1);
  if(e.key==="ArrowRight") goto(sel+1);
  if(e.key==="Enter") openCat(P[sel]);
});

const ticks=$("#ticks");
P.forEach((p,i)=>{
  const b=el("button","tick"); b.setAttribute("role","tab");
  b.append(el("span","tick-n",p.name), el("span","tick-c",p.slots.length+" slots"));
  b.onclick=()=>goto(i); ticks.appendChild(b);
});
goto(0); fit(0, true);

/* ── catalogue ─────────────────────────────────────────── */
function openCat(p){
  const i = P.indexOf(p);
  if(i >= 0 && i !== sel){ sel = i; fit(sel); marks(); }
  document.body.classList.add("reading");
  $("#cname").textContent=p.name;
  $("#cmeta").innerHTML=`<span><b>${p.slots.length}</b> slots</span>`+
    `<span><b>${nf(p.chars)}</b> chars</span><span><b>${p.chunks}</b> history</span>`+
    (p.archived?`<span><b>${p.archived}</b> archived</span>`:"");
  const g=$("#groups"); g.innerHTML="";
  const byCat = {};
  (p.history||[]).forEach(h => { (byCat[h.cat] ||= []).push(h); });
  // Union, so a category that exists only as history still gets a home.
  const cats = [...new Set([...p.slots.map(s=>s.cat), ...Object.keys(byCat)])];
  cats.forEach(cat=>{
    const sec=el("section","group"), h=el("div","group-hd");
    const sw=el("span","sw"); sw.style.background=css(cat);
    h.append(sw, el("span",null,cat), el("span","ln"));
    const cards=el("div","cards");
    p.slots.filter(s=>s.cat===cat).forEach(s=>{
      const b=el("button","slot"), stack=el("div","stack");
      for(let i=0;i<Math.min(s.prior,3);i++) stack.appendChild(el("i"));
      const face=el("div","face"); face.style.borderTopColor=css(s.cat);
      face.append(el("div","slot-k",s.key||s.cat), el("div","slot-c",s.key?s.cat:"main slot"));
      const m=el("div","slot-m");
      m.innerHTML=`<span>${nf(s.chars)} ch</span>`+
        (s.prior?`<span class="vcount">${s.prior} prior</span>`:`<span>${s.updated.slice(5)}</span>`);
      face.appendChild(m); b.append(stack,face); b.onclick=()=>read(s,p);
      cards.appendChild(b);
    });
    sec.append(h,cards);
    const hist = (byCat[cat]||[]).slice().sort((a,b)=>b.at.localeCompare(a.at));
    if(hist.length){
      const det=el("details","hist"), sum=el("summary");
      sum.innerHTML=`<span class="caret">&#9656;</span>${hist.length} point-in-time `+
        `note${hist.length>1?"s":""} — newest first`;
      det.appendChild(sum);
      hist.forEach(h=>{
        const row=el("button","hrow");
        row.append(el("span","hdate",h.at), el("span","hexc",h.text),
                   el("span","hchars",nf(h.chars)+" ch"));
        row.onclick=()=>readChunk(h,p);
        det.appendChild(row);
      });
      sec.appendChild(det);
    }
    g.appendChild(sec);
  });
  $("#cat").classList.add("on");
  $("#v-cat").setAttribute("aria-pressed","true"); $("#v-sky").setAttribute("aria-pressed","false");
}
function closeCat(){
  document.body.classList.remove("reading");
  $("#cat").classList.remove("on");
  $("#v-cat").setAttribute("aria-pressed","false"); $("#v-sky").setAttribute("aria-pressed","true");
}
$("#v-cat").onclick=()=>openCat(P[sel]);
$("#v-sky").onclick=closeCat;
$("#backbtn").onclick=closeCat;

/* ── the anchor summary card ────────────────────────────
   A project has no summary slot, and neither does a category without an
   unkeyed main entry. Where a real entry exists it is shown verbatim; where
   none does, the card says so and shows what the anchor actually holds. An
   invented "project summary" would read exactly like a stored one. */
function showCard(n){
  const c=$("#card"); c.innerHTML="";
  const p=n.proj, isProj = n.kind==="anchor";
  c.style.borderTopColor = isProj ? css("patina") : css(n.cat);

  c.appendChild(el("p","ck", isProj ? "project" : p.name + " / category"));
  c.appendChild(el("h4","cn", isProj ? p.name : n.cat));

  if(isProj){
    const cats=[...new Set(p.slots.map(s=>s.cat))];
    c.appendChild(el("p","cm",
      `${p.slots.length} slots · ${nf(p.chars)} characters · ${(p.history||[]).length} history`
      + (p.archived?` · ${p.archived} archived`:"") + (p.tier!=="general"?` · ${p.tier}`:"")));
    c.appendChild(el("p","cd","No stored summary — a project is its slots. Listed by category:"));
    const list=el("div","cl");
    cats.forEach(cat=>{
      const inCat=p.slots.filter(s=>s.cat===cat);
      list.append(el("span",null,cat),
                  el("span",null,`${inCat.length} · ${nf(inCat.reduce((a,s)=>a+s.chars,0))} ch`));
    });
    c.appendChild(list);
    const go=el("button","cgo","Open in catalogue"); go.onclick=()=>openCat(p);
    c.appendChild(go);
  } else if(n.slot){
    const s=n.slot;
    c.appendChild(el("p","cm",
      `${s.label} · ${nf(s.chars)} characters · updated ${s.updated}`
      + (s.prior?` · ${s.prior} prior`:"")));
    c.appendChild(el("p","ct",s.text));
    const go=el("button","cgo","Read in full"); go.onclick=()=>read(s,p);
    c.appendChild(go);
  } else {
    const inCat=p.slots.filter(s=>s.cat===n.cat);
    const hist=(p.history||[]).filter(h=>h.cat===n.cat).length;
    c.appendChild(el("p","cm",
      `${inCat.length} slots · ${nf(inCat.reduce((a,s)=>a+s.chars,0))} characters`
      + (hist?` · ${hist} history`:"")));
    c.appendChild(el("p","cd",
      `No main entry for ${n.cat} in this project — it exists only as keyed slots:`));
    const list=el("div","cl");
    inCat.forEach(s=>{ list.append(el("span",null,s.key||s.cat), el("span",null,nf(s.chars)+" ch")); });
    c.appendChild(list);
  }
  c.classList.add("on");
}
function hideCard(){ $("#card").classList.remove("on"); }

/* ── drawer ────────────────────────────────────────────── */
function read(s,p){
  const d=$("#dpad"); d.innerHTML="";
  const x=el("button","dclose","Close"); x.onclick=shut; d.appendChild(x);
  d.appendChild(el("p","dcat",p.name+" / "+s.cat));
  d.appendChild(el("h3","dkey",s.key||s.cat));
  d.appendChild(el("p","dmeta",`${nf(s.chars)} characters · updated ${s.updated}`+
    (s.prior?` · ${s.prior} prior version${s.prior>1?"s":""}`:" · never rewritten")));
  d.appendChild(el("p","dtext",s.text));
  if(s.versions.length){
    d.appendChild(el("p","vhead","Earlier versions — newest first"));
    s.versions.forEach(v=>{ const w=el("div","ver");
      w.appendChild(el("div","ver-m",`${v.at} · ${nf(v.chars)} characters`));
      if(v.why) w.appendChild(el("div","ver-w",v.why));
      w.appendChild(el("p","ver-t",v.text)); d.appendChild(w); });
  }
  $("#drawer").classList.add("on"); $("#drawer").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("on"); x.focus();
}
function readChunk(h,p){
  const d=$("#dpad"); d.innerHTML="";
  const x=el("button","dclose","Close"); x.onclick=shut; d.appendChild(x);
  d.appendChild(el("p","dcat",p.name+" / "+h.cat+" / history"));
  d.appendChild(el("h3","dkey","Point-in-time note"));
  d.appendChild(el("p","dmeta",
    `${nf(h.chars)} characters · recorded ${h.at} · append-only, never revised`));
  d.appendChild(el("p","dtext",h.text));
  $("#drawer").classList.add("on"); $("#drawer").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("on"); x.focus();
}
function shut(){ $("#drawer").classList.remove("on");
  $("#drawer").setAttribute("aria-hidden","true"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick=shut;
</script>
