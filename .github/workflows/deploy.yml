# Deploys the MCP server to AWS Lambda.
#
# This replaces the previous EC2 deploy. That one needed a self-hosted runner
# installed on the instance, because the security group only allowed inbound
# traffic from an allowlisted IP and hosted runners have no stable IP to
# allowlist. There is no inbound rule to satisfy any more — deploys go out to
# the AWS API — so this runs on a normal hosted runner and authenticates with
# OIDC instead of long-lived access keys.
#
# ONE-TIME SETUP this workflow assumes (none of it is created here):
#   - Lambda function `context-mcp`, runtime python3.13, architecture arm64,
#     handler `mcp_server.server.handler`, memory 512MB (measured: larger
#     memory does not meaningfully improve init time), timeout ~30s.
#   - SnapStart set to ApplyOn=PublishedVersions. This is what takes cold
#     start from ~5.3s to ~1.5s, and it is ALSO why this workflow publishes a
#     version and moves an alias rather than just updating $LATEST —
#     SnapStart never applies to $LATEST.
#   - An alias (default `live`) that clients actually point at.
#   - Function environment variables set out-of-band (console or CLI):
#     CONTEXT_MCP_SECRET_ID, MCP_ALLOWED_HOST, COGNITO_REGION,
#     COGNITO_USER_POOL_ID, COGNITO_ALLOWED_CLIENT_IDS, MCP_REQUIRED_SCOPES.
#     Deliberately NOT managed here. Note none of these are credentials: the
#     actual secrets live in Secrets Manager and are fetched at cold start by
#     the execution role, so they pass through neither CI nor the function's
#     configuration. MCP_ALLOWED_HOST must be the exact API Gateway hostname —
#     "*" is not a wildcard and yields HTTP 421.
#   - An IAM role assumable by this repo via GitHub's OIDC provider, with
#     permission to UpdateFunctionCode, PublishVersion, UpdateAlias and
#     ListVersionsByFunction on that function, plus DeleteFunction scoped to
#     the QUALIFIED ARN only (`function:context-mcp:*`, never the bare
#     `function:context-mcp`) so the prune step below can delete versions but
#     cannot delete the function itself. Its ARN goes in the
#     AWS_DEPLOY_ROLE_ARN repository secret.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  FUNCTION_NAME: context-mcp
  ALIAS: live
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build deployment bundle
        run: |
          set -euo pipefail
          # Cross-install for the function's architecture (arm64/Graviton)
          # rather than the runner's. --only-binary=:all: makes a missing
          # arm64 wheel fail loudly here instead of silently shipping a
          # wrong-architecture build that only breaks at import time.
          pip install --target build \
            --platform manylinux2014_aarch64 \
            --python-version 3.13 \
            --implementation cp \
            --only-binary=:all: \
            -r requirements-lambda.txt
          cp -r mcp_server shared build/
          # __pycache__ is safe to drop. .dist-info is NOT — importlib.metadata
          # reads it at runtime and imports fail with "No package metadata was
          # found for <pkg>" without it.
          find build -name '__pycache__' -type d -exec rm -rf {} + || true
          cd build && zip -qr ../lambda.zip .
          cd .. && ls -lh lambda.zip
          # 250MB unzipped / 50MB zipped are the hard Lambda limits for a
          # non-container deploy. Measured ~110MB / ~33MB, so this is a
          # regression alarm, not a routine constraint.
          unzipped=$(du -sm build | cut -f1)
          echo "unzipped bundle: ${unzipped}MB"
          [ "$unzipped" -lt 240 ] || { echo "bundle too large for zip deploy"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip \
            --no-cli-pager
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Publish version
        id: publish
        run: |
          version=$(aws lambda publish-version \
            --function-name "$FUNCTION_NAME" \
            --query Version --output text)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published version $version"

      - name: Wait for SnapStart optimization
        run: |
          set -euo pipefail
          # A freshly published version sits in Pending while its snapshot is
          # built. Pointing the alias at it before it goes Active would send
          # traffic to a version that cannot serve yet.
          for i in $(seq 1 40); do
            read -r state status < <(aws lambda get-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --qualifier "${{ steps.publish.outputs.version }}" \
              --query '[State,SnapStart.OptimizationStatus]' --output text)
            echo "  [$i] state=$state snapstart=$status"
            [ "$state" = "Active" ] && exit 0
            [ "$state" = "Failed" ] && { echo "version failed to become active"; exit 1; }
            sleep 15
          done
          echo "timed out waiting for version to become Active"; exit 1

      - name: Point alias at the new version
        run: |
          aws lambda update-alias \
            --function-name "$FUNCTION_NAME" \
            --name "$ALIAS" \
            --function-version "${{ steps.publish.outputs.version }}" \
            --no-cli-pager \
          || aws lambda create-alias \
            --function-name "$FUNCTION_NAME" \
            --name "$ALIAS" \
            --function-version "${{ steps.publish.outputs.version }}" \
            --no-cli-pager

      - name: Prune superseded versions
        run: |
          set -euo pipefail
          # SnapStart bills cached-snapshot storage PER PUBLISHED VERSION, for as
          # long as the snapshot lives (it is dropped only after 14 days without
          # an invocation), whether or not that version ever serves traffic. Every
          # push here publishes a version, so without this step the storage bill
          # tracks how often we deploy rather than how much traffic we serve — it
          # reached ~$0.70/day on 17 versions, 16 of which were dead.
          #
          # Two versions are kept, not one: the version the alias serves, and the
          # newest one behind it as a rollback target. Recovering from a bad
          # deploy is then `update-alias` back onto the spare, rather than a
          # revert commit and a full redeploy. The second snapshot costs roughly
          # one version's storage, which is small next to paying for every version
          # ever published.
          #
          # This runs last on purpose: only after the new version reached Active
          # (snapshot built) and the alias actually moved onto it. The guard below
          # re-reads the alias rather than trusting the earlier step, so a partial
          # or raced deploy prunes nothing.
          #
          # NOTE: `delete-function` WITHOUT --qualifier deletes the entire
          # function. Every call here is qualified, and the deploy role only holds
          # DeleteFunction on the qualified ARN, so an unqualified call would be
          # denied by IAM as well.
          live=$(aws lambda get-alias \
            --function-name "$FUNCTION_NAME" \
            --name "$ALIAS" \
            --query FunctionVersion --output text)
          if [ "$live" != "${{ steps.publish.outputs.version }}" ]; then
            echo "alias $ALIAS points at $live, not the version just published; not pruning"
            exit 1
          fi
          versions=$(aws lambda list-versions-by-function \
            --function-name "$FUNCTION_NAME" \
            --query 'Versions[?Version!=`$LATEST`].Version' --output text)
          # Highest-numbered version that is not the live one. Empty on the very
          # first deploy, when there is nothing yet to roll back to.
          spare=$(echo "$versions" | tr '\t' '\n' | grep -vx "$live" | sort -n | tail -1 || true)
          for v in $versions; do
            if [ "$v" = "$live" ] || [ "$v" = "$spare" ]; then
              continue
            fi
            aws lambda delete-function --function-name "$FUNCTION_NAME" --qualifier "$v"
            echo "pruned version $v"
          done
          echo "kept version $live (alias $ALIAS)${spare:+, rollback spare $spare}"

      - name: Report
        run: |
          echo "deployed version ${{ steps.publish.outputs.version }} to alias $ALIAS"
